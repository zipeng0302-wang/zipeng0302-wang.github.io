<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mars 3D Viewer</title>
    <!-- Import the model-viewer component -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0b0b;
            overflow: hidden;
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- Loads your local GLB model file placed in the same folder -->
    <model-viewer 
        src="src/24881_Mars_1_6792.glb"
        alt="NASA Mars 3D Model" 
        auto-rotate 
        camera-controls>
    </model-viewer>
</body>
</html>
